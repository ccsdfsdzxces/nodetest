<!DOCTYPE html>
<html>
<head>
<style>
body {
  background-color: black;
}

h1 {
  color: black;
  text-align: center;
}

p {
  color: white;
  font-size: 300px;
  text-align: center;
}
</style>
</head>
<body>

<h1>My Clock</h1>

<p id="demo"></p>

<script>
var myVar = setInterval(myTimer, 1000);

function myTimer() {
  var d = new Date();
  document.getElementById("demo").innerHTML = d.toLocaleTimeString();
}
</script>

</body>
</html>
